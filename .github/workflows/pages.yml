# Manual-only publication: GitHub Pages is publicly reachable even when the
# repository is private. Do NOT dispatch before G1 media rights are cleared.
name: Publish verified project website
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: project-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
